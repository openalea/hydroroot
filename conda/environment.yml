name: hydroroot_dev
channels:
  - openalea3
  - openalea3/label/rc
  - openalea3/label/dev
  - conda-forge
dependencies:
  # list here manually conda-only deps (listed in [tool.conda.environment] section of pyproject)
  - python
  - pip
  - openalea.mtg
  - openalea.plantgl
  - openalea.widgets
  - yaml
  - openalea.rsml
  - matplotlib
  # let pip install the rest using pyproject.toml (if you are okay with conda/pip mix)
  - pip:
      - -e .."[doc, test]"